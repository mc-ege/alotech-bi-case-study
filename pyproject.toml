[project]
name = "alotech-bi-case-study"
version = "0.1.0"
description = "Case study for alotech interview"
readme = "README.md"
authors = [
    { name = "mc-ege", email = "mehmetege@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-cloud-bigquery>=3.46.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = [
    "I",   # Import sorting
    "B",   # Common bug-prone patterns
    "UP",  # Modern Python syntax
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra"]
